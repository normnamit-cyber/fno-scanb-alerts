name: FNO Scan B Alert

on:
  schedule:
    # 09:00 UTC = 2:30 PM IST — a bit early on purpose; the script itself
    # waits until 2:40 PM before doing anything, so small delays in when
    # GitHub actually starts the job (common with free scheduled jobs)
    # don't cause it to miss the window.
    - cron: "0 9 * * 1-5"   # weekdays only
  workflow_dispatch: {}      # lets you manually trigger a test run anytime

jobs:
  run-scan-b:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # safety cap — the real work only takes ~40 min

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Scan B bot
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
